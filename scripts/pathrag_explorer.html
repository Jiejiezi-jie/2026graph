<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathRAG | Full Graph</title>
<style>
*{box-sizing:border-box;letter-spacing:0}body{margin:0;font-family:Arial,"Microsoft YaHei",sans-serif;color:#22292c;background:#f5f7f7}header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;background:#fff;border-bottom:1px solid #d8dfe0;gap:12px}h1{font-size:21px;margin:0}#counts{font-size:13px;color:#536266}main{height:calc(100dvh - 62px);display:grid;grid-template-columns:300px 1fr}aside{background:#fff;border-right:1px solid #d8dfe0;overflow:auto;padding:16px}label{display:block;font-size:12px;color:#59686d;margin:12px 0 6px}input,select,button{font:inherit;border:1px solid #cad4d6;background:white;border-radius:5px;padding:8px;color:inherit}input,select{width:100%;min-width:0}button{cursor:pointer}button:hover{background:#eaf2f2}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #007f86}#stage{position:relative;min-width:0;min-height:0}#cy{position:absolute;inset:0}.toolbar{position:absolute;top:12px;right:12px;display:flex;gap:5px;z-index:2}.toolbar button{width:37px;height:37px;padding:0;font-size:22px}#results{max-height:200px;overflow:auto;margin-top:8px}.result,.neighbor{width:100%;text-align:left;margin:3px 0;font-size:12px;overflow-wrap:anywhere}.result span{display:block;font-size:11px;color:#637477;margin-top:3px}h2{font-size:16px;margin:20px 0 8px;overflow-wrap:anywhere}p{font-size:12px;line-height:1.6;overflow-wrap:anywhere;white-space:pre-wrap}.muted{font-size:11px;color:#657579;line-height:1.6;overflow-wrap:anywhere}.actions{display:flex;gap:6px;margin-top:10px}.actions button{font-size:12px;flex:1}details{margin:10px 0;font-size:12px;overflow-wrap:anywhere}summary{cursor:pointer;padding:5px 0}#legend{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;font-size:10px;color:#536266}.swatch{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}#status{position:absolute;bottom:12px;left:12px;right:12px;font-size:12px;pointer-events:none;color:#52666a;background:#ffffffdb;padding:7px 10px;width:fit-content;max-width:calc(100% - 24px)}#loading{position:absolute;inset:0;background:#f5f7f7;display:grid;place-items:center;z-index:3}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}@media(max-width:650px){header{height:70px;padding:10px 12px;align-items:flex-start;flex-direction:column;gap:4px}h1{font-size:18px}main{height:calc(100dvh - 70px);grid-template-columns:1fr;grid-template-rows:minmax(280px,55%) 1fr}#stage{grid-row:1}aside{grid-row:2;border-top:1px solid #d8dfe0;padding:12px}#results{max-height:120px}.toolbar{top:8px;right:8px}}
</style></head><body>
<header><h1>PathRAG <span style="font-weight:400;color:#657579">/ 知识图谱</span></h1><div id="counts"></div></header>
<main><aside>
<label for="search">实体搜索</label><input id="search" type="search" placeholder="搜索名称或描述" autocomplete="off">
<label for="type">实体类型</label><select id="type"><option value="">全部类型</option></select>
<label class="check"><input type="checkbox" id="labels">实体名称</label>
<div class="actions"><button id="all">恢复全图</button><button id="download">导出图数据</button></div>
<div id="legend"></div><div id="matchCount" class="muted"></div><div id="results"></div>
<div id="details"><h2>图数据</h2><div id="metadata" class="muted"></div></div>
</aside><section id="stage"><div id="cy" aria-label="PathRAG 完整知识图谱"></div><div class="toolbar"><button id="plus" title="放大" aria-label="放大">+</button><button id="minus" title="缩小" aria-label="缩小">−</button><button id="fit" title="适应视图" aria-label="适应视图">⛶</button><button id="png" title="下载当前视图 PNG" aria-label="下载当前视图 PNG">↓</button></div><div id="status"></div><div id="loading">正在载入图谱…</div></section></main>
<script>/*__LIBRARY__*/</script><script>
const D=/*__DATA__*/;
const $=id=>document.getElementById(id);
const cy=cytoscape({container:$('cy'),elements:D.elements,layout:{name:'preset',fit:true,padding:35},minZoom:.015,maxZoom:12,pixelRatio:Math.min(devicePixelRatio,2),hideEdgesOnViewport:true,textureOnViewport:true,style:[
{selector:'node',style:{'background-color':'data(color)',width:'data(size)',height:'data(size)',label:'','font-size':10,color:'#25383c','text-background-color':'#fff','text-background-opacity':.85,'text-background-padding':2,'min-zoomed-font-size':9}},
{selector:'edge',style:{width:.6,'line-color':'#a7b9bd','target-arrow-color':'#90a7ac','target-arrow-shape':D.directed?'triangle':'none','arrow-scale':.5,'curve-style':'haystack',opacity:.42}},
{selector:'.dim',style:{opacity:.07}},{selector:'.focus',style:{opacity:1,'border-width':2,'border-color':'#172b2f',label:'data(label)','z-index':5}},
{selector:'edge.focus',style:{'line-color':'#d04c6b','target-arrow-color':'#d04c6b',width:2,opacity:1,'curve-style':'bezier','z-index':4}},
{selector:'.hidden',style:{display:'none'}},{selector:'node.named',style:{label:'data(label)'}},{selector:':selected',style:{'border-width':3,'border-color':'#d04c6b'}}]});
window.pathrag={cy,data:D};
$('counts').textContent=`${D.nodes.toLocaleString()} 实体 · ${D.edges.toLocaleString()} 关系`;
$('metadata').textContent=`来源：${D.source}\n导出时间：${D.exported}\n图方向：${D.directed?'有向':'无向'}\nSHA-256：${D.sha256}`;
for(const [type,color] of Object.entries(D.types)){const option=document.createElement('option');option.value=type;option.textContent=type;$('type').append(option);const tag=document.createElement('span'),dot=document.createElement('i');dot.className='swatch';dot.style.background=color;tag.append(dot,document.createTextNode(type));$('legend').append(tag)}
const sorted=cy.nodes().sort((a,b)=>b.data('degree')-a.data('degree'));
let chosen=null, timer;
function status(){const n=cy.nodes(':visible').length,e=cy.edges(':visible').length;$('status').textContent=`当前 ${n.toLocaleString()} / ${D.nodes.toLocaleString()} 实体 · ${e.toLocaleString()} / ${D.edges.toLocaleString()} 关系`}
function field(parent,title,value){if(value===undefined||value===null)return;const heading=document.createElement('label'),p=document.createElement('p');heading.textContent=title;p.textContent=String(value).split('<SEP>').join('\n\n');parent.append(heading,p)}
function attributes(parent,attrs){for(const [key,value] of Object.entries(attrs)){if(key==='source_id'){const d=document.createElement('details'),s=document.createElement('summary');s.textContent='来源片段';d.append(s);field(d,'source_id',value);parent.append(d)}else field(parent,key,value)}}
function focus(n,move=true){chosen=n;cy.batch(()=>{cy.elements().removeClass('dim focus');cy.elements().addClass('dim');n.closedNeighborhood().removeClass('dim');n.addClass('focus');n.connectedEdges().addClass('focus')});if(move)cy.animate({center:{eles:n},zoom:Math.max(cy.zoom(),1.1)},{duration:250});const box=$('details');box.replaceChildren();const h=document.createElement('h2');h.textContent=n.data('label');box.append(h);field(box,'类型 / 连接数',`${n.data('kind')} / ${n.data('degree')}`);const local=document.createElement('button');local.textContent='只看一跳邻居';local.className='neighbor';local.onclick=()=>{cy.batch(()=>{cy.elements().addClass('hidden');n.closedNeighborhood().removeClass('hidden')});cy.fit(n.closedNeighborhood(),40);status()};box.append(local);attributes(box,n.data('attributes'));const list=document.createElement('details'),summary=document.createElement('summary');summary.textContent=`相邻关系 (${n.connectedEdges().length})`;list.append(summary);n.connectedEdges().forEach(edge=>{const b=document.createElement('button');b.className='neighbor';b.textContent=`${edge.source().data('label')} → ${edge.target().data('label')}`;b.onclick=()=>edgeDetails(edge);list.append(b)});box.append(list)}
function edgeDetails(edge){cy.elements().removeClass('focus dim');edge.addClass('focus');const box=$('details');box.replaceChildren();const h=document.createElement('h2');h.textContent='关系详情';box.append(h);[edge.source(),edge.target()].forEach((n,i)=>{const b=document.createElement('button');b.className='neighbor';b.textContent=`${i?'目标':'来源'}：${n.data('label')}`;b.onclick=()=>focus(n);box.append(b)});attributes(box,edge.data('attributes'))}
function results(){const query=$('search').value.trim().toLowerCase(),kind=$('type').value;const matches=sorted.filter(n=>(!kind||n.data('kind')===kind)&&(!query||(n.data('label')+' '+(n.data('attributes').description||'')).toLowerCase().includes(query)));$('results').replaceChildren();$('matchCount').textContent=query?`${matches.length} 个匹配 · 显示前 ${Math.min(matches.length,60)} 个`:'连接数最高的实体';matches.slice(0,query?60:12).forEach(n=>{const b=document.createElement('button');b.className='result';b.textContent=n.data('label');const s=document.createElement('span');s.textContent=`${n.data('kind')} · ${n.data('degree')} 连接`;b.append(s);b.onclick=()=>{if(n.hasClass('hidden'))applyType();focus(n)};$('results').append(b)})}
function applyType(){chosen=null;const kind=$('type').value;cy.batch(()=>{cy.elements().removeClass('hidden focus dim');if(kind){cy.nodes().filter(n=>n.data('kind')!==kind).addClass('hidden');cy.edges().filter(e=>e.source().hasClass('hidden')||e.target().hasClass('hidden')).addClass('hidden')}});cy.fit(cy.elements(':visible'),35);status();results()}
$('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(results,150)};$('type').onchange=applyType;
$('labels').onchange=()=>cy.nodes().toggleClass('named',$('labels').checked);
$('all').onclick=()=>{$('type').value='';$('search').value='';applyType()};
cy.on('tap','node',e=>focus(e.target,false));cy.on('tap','edge',e=>edgeDetails(e.target));cy.on('tap',e=>{if(e.target===cy){cy.elements().removeClass('dim focus');chosen=null}});
function zoom(factor){cy.zoom({level:cy.zoom()*factor,renderedPosition:{x:cy.width()/2,y:cy.height()/2}})}
$('plus').onclick=()=>zoom(1.35);$('minus').onclick=()=>zoom(1/1.35);$('fit').onclick=()=>cy.fit(cy.elements(':visible'),35);
function save(blob,name){const a=document.createElement('a'),url=URL.createObjectURL(blob);a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('download').onclick=()=>save(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),'pathrag_full_graph.json');
$('png').onclick=()=>save(cy.png({output:'blob',bg:'#f5f7f7',scale:2}),'pathrag_view.png');
new ResizeObserver(()=>{cy.resize()}).observe($('stage'));results();status();$('loading').remove();
</script></body></html>
