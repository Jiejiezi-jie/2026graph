const D={"n":[["Basal Cell Skin Cancer",-94.1,-84.7,29,"concept","The most common type of skin cancer, also known as basal cell carcinoma (BCC), which is highly treatable and curable, especially when caught early.<SEP>A type of skin cancer that can recur at the original site or metastasize to lymph nodes or distant parts of ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-001"]],["Skin",-154.6,52.5,8,"naturalobject","The body's largest organ, acting as a barrier, with three layers: epidermis, dermis, and hypodermis.<SEP>The largest organ of the body, protecting against invaders, controlling body temperature, and allowing sensations. It has three layers: epidermis, dermis, ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Epidermis",-159.8,30.7,8,"naturalobject","The top layer of skin, providing a waterproof barrier and containing squamous cells, basal cells, and melanocytes.<SEP>The outermost layer of skin that provides a waterproof barrier and creates skin color (melanin).<SEP>The top layer of skin removed during a s",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Dermis",-308.5,101.0,2,"naturalobject","The middle layer of skin, containing connective tissue, blood vessels, oil and sweat glands, nerves, and hair follicles.<SEP>The middle layer of skin containing connective tissue, hair follicles, and sweat glands.<SEP>The layer of skin beneath the epidermis, p",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Hypodermis",-335.1,49.4,1,"naturalobject","The deepest tissue layer of skin, made up of fat and connective tissue.<SEP>The deepest layer of skin, made up of fat and connective tissue.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Basal Cells",-229.3,-32.4,3,"creature","Cells found in the lower part of the epidermis that constantly divide to form new cells replacing squamous cells on the skin's surface.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000"]],["Squamous Cells",12.8,73.4,6,"concept","Flat cells found in the upper part of the epidermis.<SEP>Flat, thin cells that normally make up the epithelium of the esophagus.<SEP>Thin, flat cells lining the esophagus; origin of squamous cell carcinoma.<SEP>Flat cells that make up the epithelial layer; sou",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-020"]],["Melanocytes",-215.5,231.8,2,"creature","Cells located in the lower part of the epidermis that produce melanin, responsible for hair, skin, and eye color and protection from UV rays.<SEP>Cells in the top layer of skin that produce melanin, responsible for skin, hair, and eye color and protection from",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Melanin",-290.6,429.4,2,"naturalobject","A pigment responsible for hair, skin, and eye color, and filters out harmful UV rays.<SEP>A pigment produced in melanocytes that gives color to hair, skin, and eyes and protects skin from harmful ultraviolet rays.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["UV Radiation",-278.5,-106.0,2,"concept","Ultraviolet radiation from the sun or tanning beds that can damage DNA in skin cells, leading to skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000"]],["DNA",-252.6,3.4,12,"naturalobject","Deoxyribonucleic acid (DNA) is the molecule that carries genetic information in cells, serving as the fundamental blueprint for how cells grow, develop, and function. DNA is tightly packaged into chromosomes within the cell, and this genetic material is respon",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-030"]],["Surgery",-12.2,74.0,33,"method","Surgery is a broad medical term for procedures that involve physical intervention, typically through an incision, to treat disease, remove cancer or other tissue, or repair the body. In oncology, it is a fundamental treatment modality used to physically remove",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-010"]],["Radiation Therapy",-33.4,129.4,81,"method","Radiation therapy is a medical treatment that uses high-energy radiation, such as x-rays, gamma rays, electrons, photons, or protons, to kill cancer cells and shrink tumors. It is a localized treatment, meaning it affects a specific area of the body. The thera",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-009"]],["Systemic Therapy",-48.4,42.9,31,"method","Systemic Therapy is a broad category of cancer treatment that uses drugs or other substances to reach and affect cancer cells throughout the body, rather than targeting a single localized area. These therapies are typically administered intravenously or orally",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-009"]],["NCCN Guidelines for Patients",40.4,8.6,40,"content","The NCCN Guidelines for Patients are a comprehensive set of patient-friendly guidelines published by the National Comprehensive Cancer Network (NCCN), a nonprofit alliance of leading cancer centers. These guidelines translate the expert consensus of the NCCN C",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-001"]],["United States",-113.6,77.2,3,"location","Country where about 3 million cases of basal cell skin cancer are diagnosed every year.<SEP>A country in North America.<SEP>Country where Pap smears have resulted in lower rates of cervical cancer.<SEP>Country where the 9-valent HPV vaccine is available.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-000","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-011"]],["Basal Cell Carcinoma",-229.0, ","Cancer that starts in squamous cells, which can occur in the skin (cutaneous) or other areas like lungs, thyroid, and esophagus.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Cutaneous squamous cell carcinoma",-516.5,-50.0,1,"concept","Squamous cell carcinoma that arises in the skin, also known as CSCC.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Basal cell layer",82.6,-323.5,1,"naturalobject","The lower part of the epidermis where basal cells are located.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Ultraviolet (UV) rays",-339.6,604.0,1,"naturalobject","Harmful rays from the sun that can damage skin and are protected against by melanin.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Tobacco smoke",-100.2,297.6,1,"naturalobject","A pollutant that can cause skin damage leading to squamous cell carcinoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004"]],["Arsenic",88.8,137.6,3,"naturalobject","A chemical element found in soil, water, and air that is an environmental toxin linked to skin cancer.<SEP>A chemical element found in soil, water, and air that is an environmental toxin and can lead to skin cancer.<SEP>A cancer-causing agent that increases lu",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-004","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-005"]],["Skin Cancer",-207.8,87.5,2,"concept","A general term for cancer that forms in the tissues of the skin. The text discusses risk factors and types, including squamous cell skin cancer.<SEP>The most common cancer in American males, mentioned as a comparison to prostate cancer.<SEP>Cancer that develop",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-005","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-079"]],["Kidneys",184.6,-96.2,22,"other","Kidneys are a pair of organs located in the abdomen that play a central role in the urinary system. Their primary function is to filter blood, removing waste products and excess water to produce urine, which then drains through the ureters and, in s ymph nodes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-014"]],["Nodal Disease",189.6,206.4,2,"concept","Condition where cancer has spread to lymph nodes.<SEP>Cancer present in lymph nodes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-158"]],["Lymph",35.4,44.7,11,"naturalobject","Lymph is a clear, watery fluid that circulates throughout the body via the lymphatic system, a network of vessels and nodes. It is also known as lymphatic fluid. Its primary functions are to provide cells with water and essential nutrients (food), and to help ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-019"]],["Doctor",12.6,-13.1,26,"person","Doctor is a medical professional who provides comprehensive patient care, including performing diagnostic procedures such as biopsies, digital rectal exams, and laryngoscopy, as well as interpreting their results. This physician advises on treatment options, i",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-028"]],["Patient",-114.6,85.1,59,"person","Patient is an individual receiving medical care, typically within the context of a suspected or confirmed cancer diagnosis, including specific types such as cutaneous squamous cell carcinoma (CSCC), mouth cancer, kidney cancer, breast cancer, and bone cancer. ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-027"]],["Cancer Cells",32.2,-56.4,25,"concept","Cancer Cells are abnormal cells characterized by uncontrolled growth and division, often resulting from genetic mutations or errors. Unlike normal cells, they break the standard rules of cell growth, multiply rapidly, and can avoid the natural process of cell ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-006","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-019"]],["Immune System",44.0,-2.5,9,"concept","The immune syst move cancerous tumors, including those that have spread.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Medical Oncologists",-98.5,402.3,1,"person","Doctors who specialize in prescribing cancer-treatment drugs, such as chemotherapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Pathologists",-71.8,442.2,1,"person","Doctors who study tissue and cells removed during a biopsy under a microscope to determine the stage of a cancerous tumor.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Plastic Surgeons",-187.3,342.9,1,"person","Doctors who can remove cancer as well as reconstruct, restore, and repair body parts.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Head and Neck Surgeons",8.1,447.1,1,"person","Doctors trained to treat conditions of the deeper parts of the head and neck, including ears, nose, and throat.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Radiation Oncologists",-86.1,439.3,1,"person","Doctors trained to use different types of radiation therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Pharmacists",5.8,455.5,1,"person","Medical professionals trained to prepare and give out medicine and explain their proper use and side effects.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Geneticists",-144.3,387.5,1,"person","Doctors who study how traits are passed down from parents to children through genes and counsel people at risk.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Oncology Nurses",-50.7,79.6,3,"person","Nurses who provide hands-on care, such as giving systemic therapy, managing care, and helping cope with side effects.<SEP>Nurses who provide hands-on care to cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-108"]],["Lymph Node Biopsy",1.3,187.9,3,"method","A procedure to test for cancer spread to lymph nodes.<SEP>A procedure to biopsy enlarged lymph nodes near a squamous cell skin cancer tumor to check for cancer cells.<SEP>A biopsy of a lymph node, possibly done if BPDCN is suspected.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-008"]],["Imaging Scans",-228.9,336.3,1,"method","Scans done if cancer goes deeper into the skin or has spread to other parts of the body.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Liquid Nitrogen",-197.0,120.1,3,"naturalobject","A very cold liquid often used in cryotherapy to freeze and destroy precancerous and cancerous cells.<SEP>A substance used to freeze semen in sperm banking.<SEP>A substance used to freeze semen and eggs for fertility preservation.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-123"]],["Carac",158.3,379.9,1,"artifact","A brand name for 5-fluorouracil cream used in topical therapy for skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Efudex",-24.5,430.1,1,"artifact","A brand name for 5-fluorouracil cream used in topical therapy for skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Fluoroplex",16.6,461.3,1,"artifact","A brand name for 5-fluorouracil cream used in topical therapy for skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Aldara",-374.3,312.7,1,"artifact","A brand name for imiquimod cream used in topical therapy for skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Sorilux",417.0,464.8,1,"artifact","A brand name for calcipotriene cream used in topical therapy for actinic keratosis.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Dovonex",419.8,447.7,1,"artifact","A brand name for calcipotriene cream used in topical therapy for actinic keratosis.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-007"]],["Vitamin D",343.9,214.3,2,"naturalobject","A nutrient that calcipotriene is a form of, which activates the skin's immune system.<SEP>A vitamin supplement recommended to help strengthen bones during thyroid cancer treatment.",["doc-3d7a4f0533 n",-198.1,-10.1,1,"method","A technique that combines saved MRI images with real-time ultrasound to provide a detailed view for precise prostate biopsies.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-091"]],["Metastasis Biopsy",98.3,14.9,1,"method","A biopsy taken from a metastasis site such as a lymph node, internal organ, or bone to test for cancer spread.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-091"]],["University of Chicago Medicine",-154.1,-306.7,1,"organization","A medical institution that provided images for PSMA-PET scans of prostate cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-091"]],["Hollow Needle",-109.5,-99.7,2,"artifact","A needle used in biopsies to extract tissue samples from the prostate or metastasis.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-091"]],["Hereditary Gene Testing",-28.5,35.2,3,"method","A type of genetic testing that looks for inherited mutations in every cell of the body.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["Tumor Testing",-195.0,-9.2,6,"method","A type of genetic testing that analyzes tumor tissue or blood for molecular changes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["FANCA",-1706.2,-1815.9,0,"gene","A gene involved in DNA repair.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["Complication",209.4,-7.5,2,"concept","An unwanted and unplanned result from a procedure, such as infection or bleeding.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["Hereditary Mutation",-148.6,-3.9,2,"concept","A mutation present in every cell of the body, inherited from parents.<SEP>A mutation passed down in families.<SEP>A genetic mutation passed down in families that can increase the risk of bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Somatic Testing",-331.8,-157.0,1,"method","Another name for tumor testing, analyzing tumor tissue for molecular changes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["DNA Repair",-426.7,90.7,1,"concept","Cellular process that fixes DNA damage; genes involved include BRCA1, BRCA2, ATM, PALB2, FANCA.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-092"]],["Tumor Node Metastasis System",-113.0,-101.7,1,"method","A staging system for describing tumors based on tumor size (T), lymph node involvement (N), and metastasis (M).",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093"]],["Androgen Deprivation Therapy",-175.9,-165.7,6,"method","A hormone therapy that reduces testosterone levels to slow or shrink prostate cancer growth.<SEP>A treatment that reduces testosterone to very low levels, used for prostate cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-094"]],["Testosterone",-156.6,-259.0,5,"naturalobject","A male hormone (androgen) that can fuel prostate cancer growth.<SEP>A hormone that is reduced by androgen deprivation therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-094"]],["PSA",-197.0,41.4,1,"data","Prostate-specific antigen, a substance in the blood that may be elevated in prostate cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093"]],["Orchiectomy",-181.7,-433.6,1,"method","Surgical removal of one or both testicles to reduce testosterone.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093"]],["LHRH Agonist",-136.2,-294.8,5,"artifact","A type of medication used in ADT, including goserelin, leuprolide, or triptorelin.<SEP>A type of hormone therapy that causes the testicles to stop making testosterone.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-094"]],["LHRH Antagonist",-154.5,-421.1,4,"artifact","A type of medication used in ADT, including degarelix or relugolix.<SEP>A type of hormone therapy that causes the testicles to stop making testosterone.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-093","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-094"]],["Anti-Androgen",-438.8,14.3 70b407d21d9c8a-chunk-111"]],["Fulvestrant",-371.4,632.8,2,"artifact","An endocrine therapy drug that may be taken with everolimus.<SEP>A SERD, also known as Faslodex, used in endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Tamoxifen",-253.8,681.6,2,"artifact","An endocrine therapy drug that may be taken with everolimus.<SEP>A SERM used in endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Taxanes",-312.0,-86.2,3,"concept","A class of chemotherapy drugs that includes docetaxel, paclitaxel, and albumin-bound paclitaxel.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110"]],["Ovarian Ablation Or Suppression",-192.2,-444.2,1,"method","Treatment to stop ovarian function, required for premenopausal patients receiving CDK4/6 inhibitors.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110"]],["Cyclin-Dependent Kinase",-258.8,-422.6,1,"concept","A cell protein that helps cells grow and divide; CDK4/6 inhibitors target this protein.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110"]],["mTOR",-225.5,330.3,3,"concept","A cell protein that helps cells grow and divide; overactivity can cause endocrine therapy to stop working.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-110","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["PARP",-212.0,-108.4,2,"concept","A cell protein that repairs cancer cells and allows them to survive; blocking it can cause cancer cells to die.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Talazoparib",-70.5,-77.8,3,"artifact","A PARP inhibitor, also known as Talzenna, used for breast cancer with BRCA1 or BRCA2 mutations and HER2- status.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Alpelisib",-29.2,532.7,1,"artifact","A PIK3CA inhibitor, also known as Piqray, used in breast cancer treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["CTLA-4",-36.4,19.7,1,"concept","An 'off switch' on immune cells that tumors take advantage of; targeted by immunotherapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Pembrolizumab",-140.5,-139.3,10,"artifact","An immunotherapy drug, also known as Keytruda, used in cancer treatment.<SEP>A checkpoint inhibitor drug (Keytruda) used for dMMR/MSI-H cancers before colectomy.<SEP>An immune checkpoint inhibitor (immunotherapy) used to treat cancers with certain biomarkers, ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-125"]],["Luteinizing Hormone-Releasing Hormone (LHRH)",-124.1,-84.4,2,"concept","A hormone made by the hypothalamus that tells the ovaries and testicles to make sex hormones; also called GnRH.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Androgen",-466.4,950.0,1,"concept","A hormone made by adrenal glands, testicles, and ovaries; can be converted to estrogen.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Bilateral Oophorectomy",1.2,141.1,1,"method","Surgery to remove both ovaries as a form of endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Ovarian Ablation",-269.7,-0.8,1,"method","Use of radiation to permanently stop the ovaries from making hormones.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Ovarian Suppression",61.9,-62.7,3,"method","Use of drugs to temporarily stop the ovaries from making hormones.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["LHRH Agonists",-62.2,-194.1,3,"artifact","Drugs that stop LHRH production, thereby stopping ovarian hormone production; examples include goserelin and leuprolide.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Aromatase Inhibitors (AIs)",-446.2,878.7,4,"artifact","Drugs that stop androgen from converting to estrogen by interfering with the enzyme aromatase; they do not affect ovarian estrogen.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Anastrozole",-519.3,880.5,1,"artifact","A non-steroidal aromatase inhibitor, also known as Arimidex.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Letrozole",-510.9,940.3,1,"artifact","A non-steroidal aromatase inhibitor, also known as Femara.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Estrogen Receptor (ER) Modulators",-240.1,401.4,3,"artifact","Drugs that prevent hormones from binding to receptors; include SERMs and SERDs.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Selective Estrogen Receptor Modulators (SERMs)",-149.8,634.3,3,"artifact","Drugs that block estrogen from attaching to hormone receptors; examples include tamoxifen and toremifene.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Toremifene",-105.3,782.0,1,"artifact","A SERM, also known as Fareston, used in endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Selective Estrogen Receptor Degraders (SERDs)",-352.4,525.8,3,"artifact","Drugs that block and destroy estrogen receptors; examples include fulvestrant and elacestrant.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Elacestrant",-507.6,597.0,1,"artifact","A SERD, also known as Orserdu, used in endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Gonadotropin-Releasing Hormone (GnRH) Agonists",242.2,0.1,1,"artifact","Drugs that suppress ovarian hormone or testosterone production.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Ethinyl Estradiol",-43.4,218.9,1,"artifact","A hormone used in high doses to treat breast cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Fluoxymesterone",-6.0,129.1,1,"artifact","A hormone used in high doses to treat breast cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Megestrol Acetate",-300.4,32.6,1,"artifact","A hormone, also known as Megace ES, used in high doses to treat breast cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Hormone Replacement Therapy",-96.9,253.0,1,"method","A treatment used for menopause symptoms, distinct from endocrine therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111"]],["Premenopause",-171.9,-26.8,5,"concept","The period when a person has menstrual periods and the ovaries are the main source of estrogen and progesterone.<SEP>The stage before menopause when the ovaries are the main source of estrogen and progesterone.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Amenorrhea",-433.6,42.7,2,"concept","The cessation of menstrual periods that may occur during treatment and for up to 2 years after, often returning in those 35 and under.<SEP>The absence of menstrual periods, which may occur during cancer treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-111","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Pathology Report",8.8,81.6,9,"content","A Pathology Report is a formal medical document prepared by a pathologist, and in specific cases, a neuropathologist, following the laboratory analysis of biopsy samples or tissue specimens. The report details the findings from the microscopic examination of t",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-084","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-091"]],["Cerebrospinal Fluid",-71.7,80.7,4,"naturalobject","A liquid that surrounds the brain and spinal cord.<SEP>A liquid that flows in and around the brain and spinal cord, protecting and nourishing the central nervous system.<SEP>Fluid that flows in and around the brain, which can be blocked by a tumor.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-115"]],["Eyes",-293.2,208.6,3,"location","Organs of sight that are connected directly to the brain and part of the CNS.<SEP>Organs connected to the brain via optic nerves, where primary CNS lymphoma can spread.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-115"]],["Secondary CNS Lymphoma",2603.6,392.3,0,"concept","A lymphoma that starts elsewhere in the body and spreads to the brain or spinal cord.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Meninges",-248.7,334.3,1,"other","Membranes that cover the brain and spinal cord.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Skull",-246.1,256.1,2,"other","The bone that shields the brain.<SEP>The bony structure of the head, where chordomas can occur at the base.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153"]],["Vertebrae",-219.0,283.2,1,"other","The bones that surround the spinal cord.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Genetic Abnormality",-214.8,176.1,2,"concept","A mutation in lymphocytes that causes them to grow out of control.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Immunodeficiency Disorder",-263.2,241.6,1,"concept","An illness that weakens the immune system's ability to fight infections.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Epstein-Barr Virus",88.2,240.9,5,"creature","A common virus that causes mononucleosis and remains dormant in the body.<SEP>A virus associated with nasopharyngeal carcinoma, tested via DNA testing.<SEP>A common virus that causes infectious mononucleosis and is associated with certain cancers, including na",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-127"]],["Autoimmune Disease",-102.9,330.0,2,"concept","A condition where the immune system overreacts and attacks healthy tissues.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Older Adult",-259.5,257.2,1,"person","People in their 60s or 70s who are more commonly diagnosed with primary CNS lymphoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Symptom",-265.7,239.2,1,"concept","A feeling or problem that may be a sign of disease.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Neurological Symptoms",-151.3,237.2,1,"concept","Symptoms such as headaches, nausea, vomiting, or seizures caused by pressure on the CNS.<SEP>Symptoms related to the nervous system, such as headaches, nausea, vomiting, seizures, and changes in personality or behavior.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Menstrual Periods",-657.9,63.4,1,"concept","The monthly shedding of the uterine lining; may stop during cancer treatment and for up to 2 years after, but often return in those 35 and under.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Disease",85.5,-313.2,1,"concept","A condition that impairs normal functioning.<SEP>A condition that the body fights with immune cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-138"]],["Mononucleosis",144.3,420.0,1,"concept","An illness caused by the Epstein-Barr virus.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Immunosuppressive Medications",-138.4,519.5,1,"artifact","Drugs that suppress the immune system, often required after organ transplant.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112"]],["Personality Changes",-181.4,223.1,1,"concept","Alterations in behavior or character, a possible symptom of primary CNS lymphoma.<SEP>Changes in personality or behavior that can occur as a symptom of primary CNS lymphoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Confusion",-180.4,213.9,1,"concept","A state of disorientation, a possible symptom.<SEP>State of being bewildered or unclear, a possible symptom of primary CNS lymphoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Memory Problems",-192.1,178.6,1,"concept","Difficulty remembering, a possible symptom.<SEP>Difficulties with memory that can occur as a symptom of primary CNS lymphoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Incontinence",-260.4,232.2,1,"concept","Loss of bladder control, a possible symptom.",["doc-3d7a4f05339f0e3f3870b4 ss of vision, a possible symptom.<SEP>Loss of sharpness of vision, which can occur as a symptom of primary CNS lymphoma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-112","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Central Nervous System (CNS)",-251.0,264.0,1,"concept","The part of the nervous system consisting of the brain and spinal cord; primary CNS lymphoma affects this system.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Cerebrospinal Fluid (CSF)",27.5,168.7,2,"naturalobject","Fluid surrounding the brain and spinal cord; primary CNS lymphoma can occur in this fluid.<SEP>The fluid surrounding the brain and spinal cord, which may contain cancer cells.<SEP>The fluid surrounding the brain and spinal cord, where cancer cells may be found",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-117"]],["Eye",-282.4,222.7,1,"location","Organ where primary CNS lymphoma can occur; symptoms may include changes in eyesight, and relapse can happen in the eye.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Stem Cell Transplant",-249.4,233.6,1,"method","A treatment option for primary CNS lymphoma that involves replacing damaged bone marrow with healthy stem cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113"]],["Neurological Exam",-215.1,99.5,2,"method","A test to assess nervous system function, important for diagnosing primary CNS lymphoma.<SEP>A set of simple tests to check alertness, balance, coordination, reflexes, hearing, and other senses, as well as an eye exam to assess nerve health.<SEP>Simple tests t",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-113","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-114"]],["Eye Exam",53.1,264.0,4,"method","Examination of the eyes to detect involvement of primary CNS lymphoma.<SEP>A thorough examination of the eyes using a slit lamp to check for lymphoma involvement.<SEP>An examination of the eyes, sometimes recommended before treatment for nasopharyngeal cancer.",[" se of the skull and the hyoid bone, containing fat, blood vessels, nerves, lymph nodes, and parts of the salivary gland.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132"]],["Ovary",70.2,-404.1,1,"location","An organ that makes eggs and hormones, part of the female reproductive system.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132"]],["Ectocervix",-127.3,50.4,3,"location","The outer part of the cervix that extends into the vagina, lined with squamous cells.<SEP>The outer part of the cervix extending into the vagina, lined with squamous cells.<SEP>The rounded, bottom part of the cervix.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-133"]],["Endocervix",130.3,-216.1,3,"location","The inner part of the cervix forming a canal between the vagina and the uterus, lined with columnar cells.<SEP>The canal between the vagina and the body of the uterus, lined with glandular cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-133"]],["Squamo-Columnar Junction",231.7,246.3,2,"location","The area where the endocervix and ectocervix meet, also called the transformation zone, where most cervical cancers start.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132"]],["Cervical Stroma",233.1,195.0,1,"location","The thick layer of muscular tissue beneath the cervical lining.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132"]],["Parametrium",195.1,177.4,1,"location","Fat and connective tissue surrounding the uterus and cervix, connecting them to the pelvis.<SEP>The tissue around the cervix.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-132","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-135"]],["Cervical Dysplasia",231.8,-500.3,3,"concept","Abnormal cell changes on the surface of the cervix, also known as cervical intraepithelial neoplasia (CIN).<SEP>Abnormal cell changes on the cervix, classified as CIN 1, 2, or 3, with HSIL being pre-cancerous.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-ch ce",301.8,-2.7,1,"concept","Coverage that pays for medical expenses, which may be lacking or limited for some cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-136"]],["Side effects",1841.9,1847.2,0,"concept","Unwanted effects of cancer treatment, such as nausea and vomiting, which should be managed in collaboration with the care team.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Cervical cancer",121.0,228.2,18,"disease","A cancer that forms in the cervix, often diagnosed by cervical biopsy, and treated with various methods including surgery, radiation, and chemotherapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Cervical biopsy",177.8,375.9,1,"method","A procedure to remove samples of cervical tissue for testing for dysplasia and cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Cone biopsy",179.4,225.5,2,"method","A procedure that removes a cone-shaped portion of the cervix, used for diagnosis and treatment of early cervical cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Fertility-sparing treatment",214.5,300.1,2,"concept","Treatment options that preserve fertility, possible for cancer confined to the cervix.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["FIGO system",226.1,383.0,1,"method","A system used to stage cervical cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["External beam radiation therapy",233.7,383.3,1,"method","A type of radiation therapy that delivers radiation from outside the body.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Clinical trials",174.1,384.7,1,"event","Research studies that test new treatments or procedures.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Minimally invasive surgery",108.2,60.8,1,"method","Surgery performed through small cuts, often laparoscopic, with less pain and scarring.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Trachelectomy",153.7,189.8,4,"method","Surgery to remove the cervix, which may be fertility-sparing, with types simple and radical.<SEP>Surgery that removes the cervix, a fertility-sparing surgery that may also remove the upper part of the vagina.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-140"]],["Extrafascial hysterectomy",-232.5,154.8,1,"method","A simple hysterectomy removing only the uterus and cervix, often used for stage IA1 cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Modified radical hysterectomy",-300.3,-35.9,1,"method","A hysterectomy removing the uterus, cervix, part of connective tissue, and a small portion of the vagina.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Radical hysterectomy",-265.5,129.4,1,"method","A hysterectomy removing the uterus, cervix, much connective tissue, and top part of the vagina.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Ovary preservation",-229.0,-142.9,2,"concept","The option to keep ovaries during hysterectomy to avoid surgical menopause.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Surgical menopause",-148.3,-258.9,3,"concept","Menopause caused by surgical removal of both ovaries, leading to sudden drop in estrogen.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Vaginal atrophy",-228.0,-426.2,1,"concept","A condition where the vaginal lining becomes thin, dry, and inflamed, often due to lack of estrogen.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Lymph node dissection",274.8,235.9,2,"method","Surgical removal of lymph nodes to check for cancer spread.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Lymph nodes",215.3,141.2,2,"naturalobject","Bean-shaped glands throughout the body that filter lymph fluid and fight infection.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Cardiovascular disease",-121.8,-200.4,1,"concept","Disease of the heart and blood vessels; a long-term risk of estrogen deficiency.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-137"]],["Atrophy",0.5,-70.6,2 y the pituitary gland that stimulates the thyroid to produce hormones.<SEP>A hormone produced by the pituit",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-150"]],["Radioactive Iodine (RAI) Therapy",-308.7,171.5,8,"method","A treatment using iodine-131 to selectively kill thyroid cancer cells, administered orally, often after thyroidectomy for high-risk cancers.<SEP>A treatment that uses radioactive iodine to destroy remaining thyroid tissue or cancer cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-150"]],["Iodine-131",-393.8,394.7,1,"naturalobject","A radioactive isotope of iodine used in RAI therapy and whole-body scans.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148"]],["Thyroidectomy",-29.7,209.5,2,"method","Surgical removal of the thyroid gland, often performed before RAI therapy for thyroid cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148"]],["Thyrotropin Alfa (Thyrogen)",-231.3,-414.2,1,"artifact","A hormone injection used to increase TSH levels for RAI therapy when thyroid hormone replacement is stopped.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148"]],["Whole-Body Radioiodine Scan",-372.4,316.3,1,"method","An imaging procedure performed after RAI therapy to detect remaining thyroid tissue or hidden cancer areas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148"]],["Nuclear Medicine Specialist",-486.5,274.5,1,"person","A medical specialist on the thyroid cancer treatment team who administers radioactive treatments.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148"]],["Differentiated Thyroid Cancer",-546.0,225.7,3,"concept","A type of thyroid cancer that takes up iodine and is often treated with RAI therapy after thyroidectomy.<SEP>A group of thyroid cancers that arise from follicular cells and retain some normal thyroid tissue features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-148","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-150"]],["Th ,346.1,122.0,1,"method","Testing while thyroid hormone is stopped to stimulate TSH and detect cancer recurrence.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-152"]],["Chapter 7: Survivorship",116.8,-125.9,1,"content","A chapter in a document providing information on survivorship care for cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-152"]],["Guide 1",1222.0,2282.0,0,"content","A guide referenced for biomarker-based therapy options in recurrent thyroid cancer.<SEP>A list of tests used to plan treatment of CLL.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-152","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Oncocytic Thyroid Cancer",-424.5,106.8,1,"concept","A type of thyroid cancer that can be treated with RAI therapy if it takes up iodine.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-152"]],["Bone Cancer",-82.6,19.5,42,"concept","A group of cancers that start in the bone or cartilage, also known as primary bone cancer.<SEP>Bone cancer is a rare type of cancer that occurs in bones, with various types such as chondrosarcoma, chordoma, Ewing sarcoma, giant cell tumor of bone, and osteosar",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Primary Bone Cancer",-253.5,2.6,2,"concept","Cancers that start in the bone, as opposed to metastatic cancers that spread to the bone from other parts of the body.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153"]],["Secondary Bone Malignancy",-206.3,-132.9,1,"concept","Metastatic cancer that starts in another part of the body and travels to the bones.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153"]],["Soft Tissue Sarcoma",-447.1,51.9,1,"concept","A type of sarcoma that starts in soft tissues like fat, muscles, nerves, tendons, and blood vessels.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153"]],["Bone Sarcoma",-350.4,147.8,2,"concept","A type of sarcoma that starts in bone cells, such as osteosarcomas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153"]],["Osteosarcoma",-162.9,243.2,5,"concept","A type of bone cancer that starts in cells in areas of rapid bone growth, near growth plates.<SEP>The more common type of bone cancer, treated with a combination of therapies.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Ewing Sarcoma",-10.7,111.6,6,"concept","A type of bone cancer that starts in the bone marrow and commonly occurs in the diaphysis of long bones or flat bones.<SEP>A type of bone cancer that begins treatment with systemic therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Chondrosarcoma",17.8,-81.6,4,"concept","A type of bone cancer that starts in cells that form cartilage.<SEP>A type of bone cancer that is typically treated with surgery to remove the tumor.<SEP>A type of bone cancer that may have IDH1 mutations.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Chordoma",-129.5,154.4,4,"concept","A type of bone cancer that starts in notochordal cells that form the spine and vertebrae.<SEP>A type of bone cancer that may be treated with surgery or radiation therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Giant Cell Tumor Of Bone",-86.1,239.9,4,"concept","An overgrowth of cells in the metaphysis that extends into the epiphysis of a bone.<SEP>A usually non-cancerous bone tumor that requires aggressive treatment to prevent bone damage.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-154"]],["Multiple Myeloma",-180.7,96.4,2,"concept","A type of cancer that affects plasma cells, mentioned as a separate condition from primary bone cancers.<SEP>A type of blood cancer that is a risk factor for anal cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-153","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-186"]],["Bone Tumor",66.0,261. 3870b407d21d9c8a-chunk-159"]],["Common Bile Duct",-395.8,-191.3,2,"location","A duct formed by the junction of the common hepatic duct and cystic duct, leading to the small intestine.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-159"]],["Pancreatic Duct",-473.5,-256.0,1,"location","A duct that joins the common bile duct before entering the small intestine.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-159"]],["Duodenum",3.1,-396.5,2,"location","The first part of the small intestine, near the gallbladder.<SEP>The first part of the small intestine, receiving chyme from the stomach.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-159","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Hepatic Vein",942.5,2401.1,0,"location","A vein that carries blood from the liver to the inferior vena cava.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-159"]],["Metastatic Colon Cancer",154.8,-188.5,1,"concept","Colon cancer that has spread to the liver.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-159"]],["Cirrhosis",69.3,-337.3,3,"concept","Scarring of the liver, a type of chronic liver disease where liver cells are replaced by scar tissue. It is a risk factor for liver cancer and an indication for screening.<SEP>A condition that increases the risk of developing liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-161"]],["Hepatitis B Virus (HBV)",68.3,-364.2,2,"creature","A virus that causes hepatitis B, which can lead to chronic hepatitis, cirrhosis, liver failure, and liver cancer. It is spread through contact with blood and bodily fluids.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Hepatitis C Virus (HCV)",93.4,-337.2,2,"creature","A virus that causes hepatitis C, which can lead to chronic hepatitis, cirrhosis, liver failure, and liver cancer. It is spread through contact with blood and bodily fluids.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Non-Alcoholic Fatty Liver Disease (NAFLD)",40.6,-369.4,2,"concept","A condition characterized by fat accumulation in the liver not due to alcohol, often associated with obesity, diabetes, and high cholesterol. It can lead to cirrhosis and liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Genetic Hemochromatosis",69.0,-394.7,1,"concept","An inherited condition causing the liver to store too much iron from food, which is a risk factor for liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Stage 4 Primary Biliary Cholangitis",53.4,-395.0,1,"concept","A late stage of primary biliary cholangitis, a chronic liver disease, which is a risk factor for liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Alpha-1-Antitrypsin Deficiency",130.1,-390.4,1,"concept","A genetic condition that can cause liver disease and is a risk factor for liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Liver Cancer Screening",114.7,-296.7,3,"method","Regular testing to detect liver cancer early in at-risk individuals, using ultrasound and alpha-fetoprotein (AFP) tests every 6 months.<SEP>Regular tests to detect liver cancer early in people without symptoms who are at risk.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-161"]],["Alpha-Fetoprotein (AFP) Test",161.0,-464.2,1,"method","A blood test that measures the level of alpha-fetoprotein, a protein that may be elevated in liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Nodules",140.5,-366.4,1,"concept","Small, round areas of tissue in the liver that may be detected by ultrasound; not all are cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Hepatitis",51.2,-365.0,4,"concept","A type of liver disease caused by viruses such as HBV and HCV, which can lead to chronic hepatitis, cirrhosis, liver failure, and liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["High Weight",50.1,-386.7,1,"concept","Obesity or being overweight, which is a risk factor for NAFLD and liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Fats",160.4,-156.9,1,"naturalobject","Nutrients that the liver breaks down.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-160"]],["Hepatocellular Carcinoma",798.0,2448.0,0,"concept","A type of liver cancer that is the focus of the book.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-161"]],["Chronic Hepatitis B",60.2,-367.0,1,"concept","A condition that increases the risk of developing liver cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-161"]],["Chyme",63.5,-391.3,1,"concept","The liquid form of food after digestion in the stomach.<SEP>The semi-fluid mass of partly digested food passed from the stomach to the small intestine.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-161","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Cardia",39.0,-455.8,1,"artifact","The opening where the esophagus connects to the stomach.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Fundus",56.7,-462.9,1,"artifact","The upper part of the stomach that bulges above the esophageal opening, storing undigested food and gases.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Body",37.4,-448.5,1,"artifact","The main part of the stomach.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Antrum",49.0,-464.9,1,"artifact","The lower portion of the stomach where food mixes with enzymes and acid.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Pylorus",94.3,-441.1,2,"artifact","A valve connecting the stomach to the duodenum, regulating passage of chyme.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Esophagogastric Junction (EGJ)",148.8,-206.3,3,"artifact","The junction where the esophagus joins the stomach, also known as gastroesophageal junction (GEJ).",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Muscle Layer",185.9,-252.8,7,"location","A layer of soft tissue that helps move food through the stomach, also called muscularis propria.<SEP>A layer of the stomach wall, part of the five main layers.<SEP>The layer of the bladder wall that muscle-invasive cancer has invaded.<SEP>The layer of the blad",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Subserosa",155.6,-363.6,4,"artifact","A layer of connective tissue supporting the serosa.<SEP>A layer of the stomach wall, part of the five main layers.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Intestinal Type",-257.2,72.2,1,"concept","A type of stomach adenocarcinoma where cells stick together and form tube- and gland-shaped structures; more likely to have targetable mutations.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Diffuse Type",-281.1,24.0,1,"concept","A type of stomach adenocarcinoma where cells do not stick together and appear scattered; less common.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Enzymes",224.7,-373.8,2,"concept","Proteins that speed up chemical reactions, such as breaking down food in the stomach.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Acid",198.8,-348.8,2,"concept","Hydrochloric acid in the stomach that helps break down food.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Nerve Cells",650.9,2486.2,0,"artifact","Cells that transmit nerve impulses, found in the submucosa.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Surface Epithelium",209.4,-373.6,1,"artifact","The thin, moist layer of cells forming the interior stomach lining; it produces mucus.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Muscularis Mucosae",112.6,-359.5,1,"artifact","A thin strip of muscle that separates the mucosa from the submucosa.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Stomach Glands",250.3,-298.3,5,"artifact","Glands in the lamina propria that produce enzymes, acid, mucus, and hormones.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-162"]],["Early-Stage Stomach Cancer",-35.8,-222.1,1,"concept","A stage of stomach cancer where the tumor has not grown beyond the mucosa layer of the stomach wall and is not in any lymph nodes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Locoregional Stomach Cancer",-96.3,-177.5,2,"concept","A stage of stomach cancer where the cancer has invaded deeper layers of the stomach wall and may have spread to nearby lymph nodes or organs.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Metastatic Stomach Cancer",-51.9,25.5,6,"concept","A stage of stomach cancer where the cancer has spread to distant parts of the body, such as the liver, peritoneum, or distant lymph nodes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Stomach Wall",98.2,-239.1,6,"concept","The anatomical structure of the stomach composed of five layers: mucosa, submucosa, muscle, subserosa, and serosa.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["H. pylori",-37.9,-270.1,1,"creature","A type of bacteria that can infect the stomach and is a risk factor for stomach cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Testing for Stomach Cancer",-31.0,-38.8,9,"concept","The process of diagnosing and staging stomach cancer through various tests and procedures.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Glioma",-47.4,117.5,48,"concept","A type of brain tumor that arises from glial cells.<SEP>A type of tumor that grows in the brain, developing from glial cells. It is the most common malignant brain tumor in adults and can be challenging to treat.<SEP>A type of tumor that develops from glial ce",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164"]],["Brain Tumor",-198.6,26.0,5,"concept","An abnormal growth of cells in the brain, which can be benign or malignant.<SEP>An abnormal growth of cells in the brain. Gliomas are a type of brain tumor.<SEP>An abnormal growth of cells in the brain that can cause various symptoms such as nausea, vomiting, ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164"]],["Peritoneum",-233.2,67.7,1,"concept","The abdominal lining, a common site for metastasis in stomach cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-163"]],["Glial Cells",-78.1,172.7,2,"concept","Brain cells that support the function of nerve cells in the central nervous system. Gliomas develop from these cells.<SEP>Support cells in the brain and spinal cord from which gliomas develop.<SEP>Supporting cells in the central nervous system from which gliom",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Astrocytomas",-50.0,239.9,2,"concept","A type of glioma that looks like star-shaped glial cells called astrocytes. They are one of the three most common types of gliomas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164"]],["Oligodendrogliomas",-246.2,56.5,2,"concept","A type of glioma that looks like oligodendrocytes, which protect electrical signaling in nerve cells. One of the three most common types.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164"]],["Glioblastomas",-222.1,55.7,4,"concept","The most destructive and dangerous type of glioma tumor, arising from precursor cells that develop into cells like astrocytes and oligodendrocytes.<SEP>The most common type of grade 4 gliomas, characterized by rapid growth and spread.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Astrocytes",-123.7,181.9,3,"concept","Star-shaped glial cells that maintain the chemical environment for communication between nerve cells.<SEP>Glial cells in the brain that astrocytomas resemble.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Oligodendrocytes",-302.5,15.0,3,"concept","Glial cells that protect electrical signaling in nerve cells.<SEP>Glial cells in the brain that oligodendrogliomas resemble.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Adults",-161.9,266.3,1,"other","Individuals aged 18 and older. Gliomas occur more often in adults than in children, and the book discusses gliomas only in adults.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-164"]],["Astrocytoma",-42.4,320.7,4,"concept","A common type of glioma tumor.<SEP>A type of glioma that resembles astrocytes, often characterized by IDH mutations.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Oligodendroglioma",-176.2,60.5,2,"concept","A common type of glioma tumor.<SEP>A type of glioma that resembles oligodendrocytes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Glioblastoma",81.1,191.7,1,"concept","A common and aggressive type of glioma tumor.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Headache",-44.5,291.7,1,"symptom","A common symptom of glioma, often worse in the morning and may occur with nausea.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Seizure",-111.6,303.5,1,"symptom","A frequent symptom in people with brain tumors, often an early sign of glioma.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Nausea And Vomiting",71.9,282.8,1,"symptom","Symptoms caused by increased pressure on the brain from the tumor.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Thinking And Speech Problems",-70.2,307.2,1,"symptom","Includes confusion, memory loss, and speech difficulties.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Weakness Or Movement Problems",-44.0,272.8,1,"symptom","Muscle weakness on one side of the body or difficulty with walking or balance.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Personality Or Mood Changes",85.8,268.0,1,"symptom","Changes in behavior or mood due to brain tumor.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Low-Grade Glioma",69.2,241.5,2,"concept","A slow-growing glioma that may not cause symptoms for years.<SEP>Gliomas with grades 1 and 2, which grow slowly.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["High-Grade Glioma",89.3,240.5,2,"concept","A fast-growing glioma that can cause symptoms within weeks or months.<SEP>Gliomas with grades 3 and 4, which grow more quickly and are more aggressive.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Caregivers",-217.6,184.8,3,"person","Individuals who provide physical, mental, and emotional support to patients.<SEP>Individuals who provide care and support to patients, and are encouraged to ask questions.<SEP>Individuals who provide care and support to cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-173"]],["Patients",-102.0,247.1,2,"person","Individuals diagnosed with glioma who receive treatment and care.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-165"]],["Blood Clots",-154.8,73.7,1,"concept","A condition linked to high-grade gliomas, occurring in the legs and lungs, causing leg swelling, chest pain, and shortness of breath.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-166"]],["Parietal Lobe",-303.4,-40.7,1,"location","A region of the brain responsible for intelligence, language, reading, sensation, and sensory perception.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-166"]],["Occipital Lobe",-375.8,21.2,1,"location","A region of the brain responsible for vision and color perception.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-166"]],["Neuropathologist",-168.1,143.7,3,"person","A specialist who examines tissue samples under a microscope to determine if a tumor is malignant or benign, and performs molecular testing to identify tumor type and grade.<SEP>A specialist who tests tissue samples for biomarkers to provide details about gliom",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["IDH Gene",21.3,500.1,1,"naturalobject","A gene that can have mutations in certain gliomas, such as astrocytomas, serving as a biomarker.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["CT Imaging",-269.7,321.1,1,"artifact","Computed tomography imaging, used in conjunction with a computerized navigation system to guide biopsies.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Craniotomy",249.9,277.6,1,"method","A surgical opening in the skull to access the brain, used in open biopsies and resections.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["IDH-Mutant",-131.7,481.7,1,"concept","A biomarker indicating a mutation in the IDH gene, used in classifying astrocytomas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-167"]],["Grade 1 Gliomas",117.6,-10.8,1,"concept","Slow-growing, usually benign tumors that can often be treated with surgery alone, more common in children than adults.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Grade 2 Gliomas",-348.7,-304.5,1,"concept","Tumors with somewhat abnormal cells that grow slowly, can invade normal tissue, and may recur as higher-grade gliomas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Grade 3 Gliomas",-232.5,-197.4,3,"concept","High-grade tumors with cells that don't look like normal cells, grow quickly, invade nearby tissue, and require additional therapy after surgery.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Grade 4 Gliomas",-239.2,-81.9,3,"concept","High-grade tumors with very abnormal cells that grow and spread very quickly, including glioblastomas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Chronic Lymphocytic Leukemia (CLL)",206.0,-178.1,2,"concept","A type of blood cancer that grows slowly, occurring in lymphocytes, and may not require treatment for years.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-168"]],["Lymph System",168.4,-227.6,2,"concept","The lymphatic system, which contains many B cells and plays a key role hat lacks CD200 and LEF1 proteins.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-169"]],["Watch and Wait",35.0,-337.8,1,"concept","A period of monitoring without immediate treatment for CLL patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-169"]],["CLL",-86.7,-220.7,34,"concept","Chronic lymphocytic leukemia, a type of blood cancer affecting B lymphocytes.<SEP>Chronic lymphocytic leukemia, a type of cancer that affects lymphocytes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["SLL",-206.0,-364.0,1,"concept","Small lymphocytic lymphoma, a related condition confirmed by lymph node biopsy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Hematologist-Oncologist",-57.0,219.9,1,"person","An expert in blood cancers who receives lab reports and plans treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Monoclonal B Lymphocytes",-240.9,-369.6,1,"cell","Abnormal white blood cells that are identical clones, used in CLL diagnosis.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Bone Marrow Aspiration",223.2,-155.0,1,"method","A procedure removing liquid and cells from bone marrow.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Hip Bone",501.8,2515.5,0,"location","The site where bone marrow biopsy and aspiration are performed.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["B Cell",-141.1,-113.0,4,"cell","A type of white blood cell that produces antibodies; CLL involves abnormal B cells.<SEP>A type of white blood cell that makes antibodies to fight infections.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["First-Degree Relatives",-72.4,-95.0,1,"concept","Close relatives such as siblings, parents, and children.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Second-Degree Relatives",153.4,-181.8,1,"concept","Relatives such as grandparents, aunts, uncles, and grandchildren.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a- er",346.7,20.7,1,"artifact","An injected medication to reduce pain during procedures.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-170"]],["Bone Marrow Test",-42.7,-261.6,2,"method","Tests that are not often needed to diagnose CLL but may be done to find out what's causing low blood cell counts.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["Biomarker Test",-2.7,-167.2,3,"method","Lab tests using blood or bone marrow samples to find biomarkers that can be used to plan treatment.<SEP>Tests that identify specific tumor cells or biomarkers, providing clues about bladder cancer but not reliable enough for diagnosis.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-176"]],["Diagnostic CT",107.5,-80.8,3,"method","A type of CT scan that uses more radiation than regular CT and adds a contrast agent to show body tissue more clearly.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["CLL Specialist",-27.3,-293.2,2,"person","A doctor who specializes in CLL; a patient expressed gratitude for a consultation with one.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["Cutaneous B-Cell Lymphoma (CBCL)",-254.6,-44.0,2,"concept","A type of lymphoma that starts in B cells, a type of white blood cell called a lymphocyte.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["Primary Cutaneous Lymphomas",-103.7,60.5,4,"concept","Lymphomas that primarily involve the skin.<SEP>A rare group of non-Hodgkin lymphomas that occur in the skin, developing from abnormal B or T lymphocytes, and are not a type of skin cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-172"]],["TP53 Gene",-438.7,-421.7,1,"data","A gene that controls how cells die when they're not healthy; mutations are looked for in DNA sequencing.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-171"]],["IGHV Gene",-516.7,-433.4,1,"data","A gene that encodes immunoglobulin heavy chain; mutations affect prognosis.",["doc- .0,1,"concept","Small pimples that cutaneous B-cell lymphoma nodules may look like.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-172"]],["Testing for CBCL",-6.8,-98.7,9,"concept","The process of testing for cutaneous B-cell lymphoma, including general health tests, skin exam, blood tests, imaging tests, biopsy, immunophenotyping, biomarker and genetic changes, and TNM scores.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-172"]],["External Beam Radiation Therapy (EBRT)",-3.7,97.4,15,"method","External Beam Radiation Therapy (EBRT) is a form of cancer treatment that delivers high-energy radiation beams—such as x-rays or particles—from a machine positioned outside the patient's body. This technique aims the radiation precisely at the tumor or cancero",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-135","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-141"]],["Urothelium",12.1,-109.7,2,"naturalobject","The inner lining of the bladder that prevents urine from leaking back into the body.<SEP>The inner layer of the urinary tract, including the bladder, kidneys, ureters, and urethra. Cancer of the urothelium can start in these areas.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-173","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-174"]],["Urinary Tract",260.8,-29.9,6,"location","The system of organs including kidneys, ureters, bladder, and urethra that produce and excrete urine.<SEP>The system in the body that produces and excretes urine, including the kidneys, ureters, bladder, and urethra.<SEP>The system including kidneys, ureters, ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-173","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-174"]],["Urothelial Cells",-1.5,-100.8,2,"naturalobject","Stretchy cells lining the inside of the bladder and the rest of the urinary tract.<SEP>Cells that make up the inner lining of the bladder, where most bladder cancers start.<SEP>Cells that make up the inner lining of the bladder, where most bladder cancers orig",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-ch actor considered when choosing bladder cancer treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-174"]],["Non-Invasive Bladder Cancer",147.9,-142.5,1,"concept","Early-stage bladder cancer confined to the inner layer; usually curable.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-175"]],["Multidisciplinary Care Team",182.3,1.9,17,"organization","A team of health care providers from different specialties who work together to treat a patient's bladder cancer.<SEP>A team of specialists and care providers who work together to treat bladder cancer, including doctors, nurses, and other healthcare profession",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-175","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-176"]],["Quitting Smoking",-52.5,-134.6,1,"concept","The act of stopping smoking, which is recommended as part of bladder cancer care.<SEP>The act of stopping smoking, which can reduce cancer risk and improve treatment outcomes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-175","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Inherited Cancer Risk",167.5,-184.8,1,"concept","The increased likelihood of developing cancer due to genetic factors passed down in families.<SEP>The increased likelihood of developing cancer due to inherited genetic mutations.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-175","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Urologic Oncologist",110.2,-163.4,2,"person","A surgeon who diagnoses and treats cancers of the urinary tract and male reproductive organs using surgery and intravesical therapy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-176"]],["Pharmacist",358.7,-37.3,1,"person","A professional who prepares chemotherapy and other medicines and offers treatment advice.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-176"]],["Advanced Practice Provider",350.5,-96.8,1,"person","Registered nurse practitioners and physician assistants who monitor health and provide care.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-176"]],["Resident", lps detect tumors more clearly during cystoscopy without requiring a dye.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177"]],["Urogram",504.7,-24.0,2,"method","Imaging using contrast solution with CT or MRI to see how well the urinary tract is working.<SEP>An imaging test that uses contrast and CT or MRI to visualize the lining of the urinary tract, including kidneys, ureters, and bladder, to detect abnormalities suc",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Renal Ultrasound",363.3,-172.2,1,"method","Painless, non-surgical test using sound waves to produce black and white images of kidneys and other organs.<SEP>A painless, non-surgical imaging test that uses sound waves to produce real-time black and white images of the kidneys, ureters, and bladder.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Flexible Cystoscope",481.2,117.8,1,"artifact","A type of cystoscope used for viewing and biopsy, less invasive than rigid cystoscope.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177"]],["Rigid Cystoscope",426.8,203.3,1,"artifact","A more invasive type of cystoscope that can also remove small tumors.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177"]],["MRI Machine",-78.3,148.2,1,"artifact","A large machine with a tunnel used for MRI scans, makes noise and uses magnets.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177"]],["Contrast Solution",647.5,10.6,1,"artifact","A substance used in urogram to make the lining of kidneys, ureters, and bladder easier to see.<SEP>A substance used in imaging tests to enhance visibility of certain structures.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-177","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Pyelogram",199.6,2547.4,0,"method","An imaging test that uses x-rays and contrast solution to detect blockages such as tumors, kidney stones, or blood clots in the ureters or kidneys, often performed during a cystoscopy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Chest Imaging",-443.0,564.4,1,"method","An imaging test using CT or x-ray to determine if cancer has spread to the lungs.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-018"]],["CDKN2A",47.7,2549.7,0,"data","A gene in which germline mutations are commonly found in bladder cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["FGFR3",-104.2,2543.0,0,"data","A gene in which germline mutations are commonly found in bladder cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["ERBB",-255.3,2527.3,0,"data","A gene in which germline mutations are commonly found in bladder cancer patients.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Imaging Study",-405.3,2502.6,0,"method","A test that creates pictures of the inside of the body, such as CT, MRI, or x-ray.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Kidney Stone",-553.5,2469.0,0,"concept","A hard deposit that forms in the kidneys and can cause blockages.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Side Pain",-699.5,2426.7,0,"concept","Pain in the side or back that may be a symptom of urinary tract problems.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["E-cigarette",-842.6,2375.7,0,"artifact","A device that delivers nicotine via vapor, also known as vaping, which can affect cancer treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Medicine",-982.5,2316.3,0,"artifact","Pharmaceuticals that can aid in smoking cessation or treat cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Upper Urinary Tract",-1118.6,2248.6,0,"naturalobject","The part of the urinary tract including the kidneys and ureters.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["High Grade Cancer",-1250.4,2173.0,0,"concept","A fast-growing cancer that may warrant germline testing.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Insurance F ting potential inherited risk.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Child",-2422.2,470.5,0,"person","An offspring who may inherit cancer-related genes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Parent",-2445.8,320.3,0,"person","An individual from whom inherited mutations may be passed.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Specialist",-2460.4,169.1,0,"person","A healthcare provider with expertise in a specific area, who may request test results.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Care Team Member",-2465.9,17.2,0,"person","An individual on the care team, whose contact information should be kept.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Smoker",-2462.4,-134.8,0,"person","An individual who smokes tobacco, at higher risk for bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Non-Smoker",-2449.9,-286.2,0,"person","An individual who does not smoke, but may be affected by secondhand smoke.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Vaper",-2428.3,-436.7,0,"person","An individual who uses e-cigarettes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Cancer Patient",-2397.9,-585.5,0,"person","An individual diagnosed with cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Bladder Cancer Patient",-2358.6,-732.4,0,"person","An individual diagnosed with bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Person with Inherited Risk",-2310.6,-876.6,0,"person","An individual who carries inherited mutations increasing cancer risk.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Person with Lynch Syndrome",-2254.1,-1017.7,0,"person","An individual with Lynch syndrome or a family history of it.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Person Under 50",-2189.4,-1155.1,0,"person","An individual younger than 50, for whom germline testing may be appropriate.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-178"]],["Person
