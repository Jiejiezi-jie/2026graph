ing fast growth, abbreviated as HG.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-179"]],["Urothelial Cancer",348.1,446.5,9,"concept","The most common type of bladder cancer, arising from urothelial cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Glandular Subtype",399.4,632.0,1,"concept","A rare subtype of urothelial cancer with glandular features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Squamous Cell Subtype",424.2,612.7,1,"concept","A rare subtype of urothelial cancer with squamous cell features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Micropapillary Subtype",384.9,582.3,1,"concept","A rare subtype of urothelial cancer with micropapillary features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Plasmacytoid Subtype",414.1,633.7,1,"concept","A rare subtype of urothelial cancer with plasmacytoid features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Sarcomatoid Subtype",438.2,595.8,1,"concept","A rare subtype of urothelial cancer with sarcomatoid features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Nested Subtype",415.1,592.4,1,"concept","A rare subtype of urothelial cancer with nested features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Lymphoepithelioma-Like Subtype",416.0,604.5,1,"concept","A rare subtype of urothelial cancer with lymphoepithelioma-like features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Microcystic And Tubular Subtype",372.2,644.2,1,"concept","A rare subtype of urothelial cancer with microcystic and tubular features.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Low Grade Bladder Cancer",-93.4,41.5,1,"concept","Bladder cancer that is slow growing, indicated by LG.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["High Grade Bladder Cancer",-99.4,-108.1,1,"concept","Bladder cancer that is fast growing, indicated by HG.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Stage 0 Bladder Cancer",-120.0,-54.7,1,"concept","Bladder cancer stage where abnormal cells are present on the inner lining but have not invaded the muscle layer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Stage 1 Bladder Cancer",157.6,-160.5,1,"concept","Bladder cancer stage where a tumor has formed and invaded the connective tissue layer but not the muscle.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Stage 2 Bladder Cancer",194.5,-150.7,1,"concept","Muscle-invasive bladder cancer where the tumor has invaded the muscle layer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Stage 3 Bladder Cancer",99.7,-75.2,2,"concept","Muscle-invasive bladder cancer where the tumor has grown into the fat layer around the bladder, possibly involving nearby lymph nodes.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Stage 4 Bladder Cancer",-44.1,-149.2,1,"concept","Metastatic bladder cancer that has spread outside the bladder to distant sites.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Transurethral Resection Of Bladder Tumor (TURBT)",87.2,40.7,7,"method","A surgical procedure to remove bladder tumors through the urethra without abdominal incision.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["Fat Layer",331.7,136.8,1,"bodypart","The layer of fat around the bladder that stage 3 cancer invades.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-180"]],["TURBT",-25.2,-119.7,5,"method","Transurethral resection of bladder tumor, a procedure that examines and removes tumors on the bladder wall.<SEP>Transurethral resection of bladder tumor, a surgical procedure to remove visible cancer from the bladder.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182"]],["Cystectomy",258.5,24.6,3,"method","Surgery to remove the bladder, with types including radical and partial cystectomy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Radical Cystectomy",103.8,-4.6,15,"method","A major surgery that removes the entire bladder, nearby lymph nodes, and sometimes other organs; the most common surgery for muscle-invasive bladder cancer.<SEP>The most widely used surgery for muscle-invasive bladder cancer. It involves removing the bladder, ",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-185"]],["Partial Cystectomy",399.4,31.6,1,"method","A surgical procedure to remove part of the bladder, rarely used for bladder cancer treatment.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Urinary Diversion",30.3,-175.9,5,"method","An additional surgical procedure to create a new way for urine to exit the body after bladder removal.<SEP>A surgical procedure that creates a new way for urine to leave the body after bladder removal, with types including the Indiana pouch.<SEP>A surgical pro",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182"]],["Neobladder",48.2,-58.1,6,"method","A type of urinary diversion where a segment of small intestine replaces the bladder, allowing urine to exit through the urethra.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Continent Cutaneous Pouch",-131.2,-207.0,7,"method","A type of urinary diversion using a portion of the large intestine to create a pouch, with a stoma and catheter for emptying.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Urinary Incontinence",-10.3,111.1,4,"concept","Involuntary leakage of urine, a possible side effect after neobladder surgery.<SEP>A side effect of bladder cancer treatment involving trouble controlling the flow of urine.<SEP>A condition characterized by trouble controlling the flow of urine, where urine ma",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-184"]],["Indiana University",-228.2,-363.0,1,"organization","The institution where surgeons developed the Indiana pouch urinary diversion.<SEP>The university where surgeons developed the Indiana pouch procedure.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182"]],["Vas Deferens",201.9,142.7,1,"other","A tube that carries sperm away from the testicles; part of it may be removed during radical cystectomy.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Abdominal Wall",-2.3,-310.7,2,"other","The wall of the abdomen where a stoma is created in some urinary diversions.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Belly Button",-330.1,-241.8,1,"other","A location where a stoma can be made in continent cutaneous pouch to be less noticeable.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-181"]],["Bacillus Calmette-Guérin (BCG)",25.8,-102.7,8,"method","A type of intravesical therapy using a weakened bacterium to trigger the immune system to attack bladder cancer cells, commonly used for high-grade non-muscle-invasive bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182"]],["Intravesical Chemotherapy",1.3,-181.7,6,"method","A type of intravesical therapy using chemotherapy drugs to kill cancer cells in the bladder, often given after TURBT or as an alternative to BCG.<SEP>A localized chemotherapy treatment that affects only the inside of the bladder.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["BCG Shortage",28.6,-168.4,2,"event","A period of reduced availability of BCG treatment in the United States and worldwide, affecting patients with non-muscle-invasive bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182"]],["Bladder Removal Surgery",-56.1,-30.0,4,"method","A surgical procedure to remove the bladder, sometimes offered as an option when BCG treatment is not available or effective.<SEP>A treatment for bladder cancer that can cause side effects such as bleeding, blood clots, kidney problems, infection, sexual dysfun",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-182","doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-184"]],["Systemic Chemotherapy",5.1,-375.9,1,"method","A whole-body cancer treatment that uses drugs to kill cancer cells throughout the body, often administered intravenously.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Dose-Dense Chemotherapy",94.6,12.4,2,"method","A method of speeding up chemotherapy by shortening the time between treatment doses.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["ddMVAC",104.8,24.5,5,"method","A combination chemotherapy regimen for bladder cancer consisting of dose-dense methotrexate, vinblastine, doxorubicin, and cisplatin.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Checkpoint Inhibitors",-203.0,-321.5,5,"method","A type of immunotherapy that blocks natural braking mechanisms to allow the immune system to fight cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Keytruda",-35.3,-378.0,3,"artifact","Brand name for pembrolizumab, a checkpoint inhibitor used for bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Opdivo",-224.1,-345.0,2,"artifact","Brand name for nivolumab, a checkpoint inhibitor used for bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Bavencio",-270.1,-509.2,2,"artifact","Brand name for avelumab, a checkpoint inhibitor used for bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Tecentriq",-356.8,-522.5,2,"artifact","Brand name for atezolizumab, a checkpoint inhibitor used for bladder cancer.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Padcev",169.7,-554.6,3,"artifact","Brand name for enfortumab vedotin-ejfv, an antibody-drug conjugate targeting Nectin-4 on bladder cancer cells.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Balversa",-1423.6,632.5,2,"artifact","Brand name for erdafitinib, a targeted therapy for bladder cancer with FGFR3 gene mutations.",["doc-3d7a4f05339f0e3f3870b407d21d9c8a-chunk-183"]],["Trodelvy",-1502.6,459.8,2,"artifact","Brand name for sacituzumab govitecan-hziy, a targeted therapy that targets Trop-2 protein on cancer cells.",["doc-3d7a4f05
